name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GitHub only: the Forgejo runner also picks up .github/workflows when a repo has
# no .forgejo/workflows. hassfest/HACS jobs come with custom_components/.

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Pytest
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: pytest -q --tb=short
